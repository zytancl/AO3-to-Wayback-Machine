name: auto bump version

# fires when ao3-wayback-machine.user.js is pushed to main.
# reads the current @version, increments the minor number, writes it
# back to the file, and commits. userscript managers (tampermonkey,
# violentmonkey, etc.) compare @version from @updateURL against the
# installed copy and prompt an update whenever the number is higher.

on:
  push:
    branches: [main]
    paths:
      - ao3-wayback-machine.user.js

jobs:
  bump:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN pushes don't retrigger workflows by default, but this
    # guard is extra safety — skip if the commit was already a version bump
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"

    permissions:
      contents: write   # needed to push the version commit back

    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        run: |
          python3 - << 'PYEOF'
          import re, sys

          path = 'ao3-wayback-machine.user.js'
          with open(path, 'r') as f:
              content = f.read()

          # match e.g. "// @version      2.8"
          m = re.search(r'(@version\s+)(\d+)\.(\d+)', content)
          if not m:
              sys.exit('ERROR: could not find @version in script')

          major = int(m.group(2))
          minor = int(m.group(3))
          old_ver = f'{major}.{minor}'
          new_ver = f'{major}.{minor + 1}'

          # update both the @version metadata line and the
          # version string inside exportErrorLog
          content = content.replace(
              f'@version      {old_ver}',
              f'@version      {new_ver}',
          )
          content = content.replace(
              f"version: '{old_ver}'",
              f"version: '{new_ver}'",
          )

          with open(path, 'w') as f:
              f.write(content)

          print(f'Bumped {old_ver} -> {new_ver}')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ao3-wayback-machine.user.js
          # only commit if there are actual changes (avoids empty commits)
          git diff --staged --quiet || git commit -m "chore: bump version"
          git push
